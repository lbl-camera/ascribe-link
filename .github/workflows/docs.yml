name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs deps
        run: pip install -e ".[docs]"

      - name: Build HTML docs
        run: sphinx-build -W -b html docs docs/_build/html

      # Sphinx emits _static/ and _sources/; without this GitHub Pages'
      # Jekyll pass drops every underscore-prefixed directory.
      - name: Disable Jekyll
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # Pages is unavailable on a private repo under this plan. Flip the
    # PAGES_ENABLED repo variable to 'true' once the repo is public and
    # Pages is set to "GitHub Actions" — until then the build still runs
    # and only the deploy is skipped.
    if: github.ref == 'refs/heads/master' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
